services:
  - type: web
    name: yousheng-companion-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: DeepSeek
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_DEEP_MODEL
        value: deepseek-v4-pro
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: CHAT_LIMIT
        value: "60"
